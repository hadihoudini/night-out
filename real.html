<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Night Out: real night mode</title>
  <meta name="description" content="Your night-out safety toolkit: share where you are, check your taxi, quick dial, safe places and a home-by check-in. Everything stays on your phone.">
  <meta name="theme-color" content="#120a1f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23120a1f'/%3E%3Crect x='4' y='2' width='8' height='12' fill='%23ff4fa3'/%3E%3Crect x='5' y='3' width='6' height='8' fill='%231d2357'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="real.css">
</head>
<body class="real">
  <div class="device">
    <div class="statusbar" aria-hidden="true"><span id="clock">--:--</span><span class="sb-right"><i></i><i></i><i></i><i></i><b></b></span></div>
    <header class="r-top">
      <button type="button" class="r-back" id="back" style="visibility:hidden">◀ Back</button>
      <span class="r-title" id="title">REAL NIGHT</span>
      <a class="r-game" href="index.html">Game ▶</a>
    </header>
    <main class="r-view" id="view" aria-live="polite"></main>
  </div>

  <div class="r-alert" id="alert" hidden role="alertdialog" aria-labelledby="alertTitle">
    <div class="r-alert-box">
      <h2 id="alertTitle">Are you home safe?</h2>
      <p id="alertText"></p>
      <div class="r-stack" id="alertActions"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="real.js"></script>
</body>
</html>
